<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCMON — guide d'installation (canvas)</title>
<style>
  html, body { margin: 0; background: #000; min-height: 100vh; display: flex; flex-direction: column; align-items: center; font-family: monospace; }
  canvas { width: min(480px, 100vw); image-rendering: pixelated; cursor: pointer; margin: 12px 0 4px; }
  p { color: #5c5c5c; font-size: 12px; margin: 0 0 12px; }
</style>
</head>
<body>
<canvas id="c" width="960" height="1280"></canvas>
<p>clic ou flèche → pour changer de page — PCMON</p>
<script>
"use strict";
const VW = 480, VH = 640;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const off = document.createElement("canvas");
off.width = VW; off.height = VH;
const g = off.getContext("2d");
const C = { bg:"#000000", panel:"#0a0a0a", grid:"#1a1a1a", border:"#2a2a2a",
            white:"#ffffff", light:"#e8e8e8", mid:"#9a9a9a", dim:"#5c5c5c", accent:"#6e6e6e" };

function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x|0, y|0, Math.max(1, w|0), Math.max(1, h|0)); }
function text(x, y, s, size, c, align, bold) {
  g.fillStyle = c; g.font = (bold ? "bold " : "") + size + "px monospace";
  g.textAlign = align || "left"; g.textBaseline = "top"; g.fillText(s, x, y);
}
function box(x, y, w, h, title) {
  rect(x, y, w, h, C.panel);
  g.strokeStyle = C.border; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (title) text(x + 8, y + 6, title, 8, C.mid, "left", true);
}
function chart(x, y, w, h, data, max, rows, color, secondary, scolor) {
  const ch = h / rows;
  g.strokeStyle = C.grid; g.lineWidth = 1;
  for (let r = 1; r < rows; r++) {
    g.beginPath(); g.moveTo(x + .5, y + r * ch + .5); g.lineTo(x + w, y + r * ch + .5); g.stroke();
  }
  const draw = (arr, col) => {
    if (!arr) return;
    const cw = w / arr.length;
    arr.forEach((v, i) => {
      const f = Math.max(v > 0 ? 1 : 0, Math.round(Math.max(0, Math.min(1, v / max)) * rows));
      rect(x + i * cw, y + h - f * ch, cw, f * ch, col);
    });
  };
  if (secondary) draw(secondary, scolor || C.accent);
  draw(data, color || C.white);
}
function card(x, y, w, h, label, val, data, max, col, secondary, scolor) {
  rect(x, y, w, h, C.panel);
  g.strokeStyle = C.border; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  text(x + 5, y + 4, label, 6, C.dim);
  text(x + w - 5, y + 4, val, 6, C.white, "right");
  chart(x + 4, y + 14, w - 8, h - 20, data, max, 8, col, secondary, scolor);
}
const sine = (n, ph, amp, base) =>
  Array.from({ length: n }, (_, i) => base + amp * Math.abs(Math.sin(i * 0.35 + ph)) + amp * 0.4 * Math.abs(Math.sin(i * 0.11 + ph * 2)));

let page = 0;

function header(sub) {
  rect(0, 0, VW, 36, C.panel);
  g.strokeStyle = C.border; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, 36.5); g.lineTo(VW, 36.5); g.stroke();
  text(10, 10, "PCMON", 14, C.white, "left", true);
  if (Math.floor(Date.now() / 530) % 2 === 0) rect(80, 11, 7, 12, C.white);
  text(VW - 10, 14, sub, 8, C.dim, "right");
}
function footer() {
  g.strokeStyle = C.border; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, VH - 24.5); g.lineTo(VW, VH - 24.5); g.stroke();
  text(10, VH - 18, "PCMON — moniteur PC en temps réel", 7, C.dim);
  text(VW - 10, VH - 18, "clic / → : page suivante", 7, C.dim, "right");
}

function page1() {
  header("INSTALLER · 1/2");
  box(10, 48, 460, 108, "1 · SUR LE PC");
  text(18, 72, "$ cd pc-server", 8, C.light);
  text(18, 86, "$ pip install -r requirements.txt", 8, C.light);
  text(18, 100, "$ python3 server.py", 8, C.light);
  text(18, 120, "→ écoute sur http://127.0.0.1:8765", 8, C.white, "left", true);
  text(18, 136, "(par défaut : rien d’exposé sur le réseau)", 7, C.dim);

  box(10, 164, 460, 158, "2 · RELIER LE TÉLÉPHONE AU PC");
  text(18, 188, "A) USB + adb :", 8, C.white, "left", true);
  text(26, 202, "adb reverse tcp:8765 tcp:8765", 8, C.light);
  text(26, 216, "appli → http://127.0.0.1:8765", 8, C.mid);
  text(18, 234, "B) câble USB + partage de connexion :", 8, C.white, "left", true);
  text(26, 248, "appli → http://192.168.42.129:8765", 8, C.mid);
  text(18, 266, "C) Wi-Fi, même réseau : --host 0.0.0.0", 8, C.white, "left", true);
  text(26, 280, "appli → http://<IP-du-PC>:8765 (IP au lancement)", 8, C.mid);

  box(10, 330, 460, 96, "3 · SUR LE TÉLÉPHONE (Android)");
  text(18, 354, "ouvrir android/ dans Android Studio → ▶ Run", 8, C.light);
  text(18, 368, "ou : ./gradlew assembleDebug puis installer", 8, C.light);
  text(18, 382, "l’APK app-debug.apk sur le téléphone", 8, C.light);
  text(18, 402, "dans l’appli : adresse du serveur → CONNEXION", 8, C.white, "left", true);

  box(10, 434, 460, 158, "APERÇU DE L’ÉCRAN");
  card(18, 458, 216, 62, "CPU", "23 %", sine(40, 0, 26, 30), 100, C.white);
  card(242, 458, 216, 62, "RAM", "61 %", sine(40, 1, 20, 40), 100, C.white);
  card(18, 528, 216, 62, "RÉSEAU ↓/↑", "1.2 Mo/s", sine(40, 2, 500, 300), 1000, C.white, sine(40, 3, 200, 100), C.accent);
  card(242, 528, 216, 62, "DISQUE R/W", "45 %", sine(40, 4, 20, 30), 80, C.white, sine(40, 5, 12, 10), C.accent);
  footer();
}

function page2() {
  header("UTILISER · 2/2");
  box(10, 48, 460, 196, "L’ÉCRAN PRINCIPAL — CARTES EN GRILLE 2×2");
  card(18, 72, 218, 78, "CPU", "23 %", sine(60, 0, 30, 30), 100, C.white);
  card(244, 72, 218, 78, "RAM", "61 %", sine(60, 1, 20, 40), 100, C.white);
  card(18, 158, 218, 78, "RÉSEAU ↓/↑", "1.2 Mo/s", sine(60, 2, 500, 300), 1000, C.white, sine(60, 3, 200, 100), C.accent);
  card(244, 158, 218, 78, "DISQUE R/W", "45 %", sine(60, 4, 20, 30), 80, C.white, sine(60, 5, 12, 10), C.accent);

  box(10, 252, 460, 122, "LÉGENDE");
  text(18, 276, "■ blanc = courbe principale   ■ gris = 2e courbe (↑ / W)", 8, C.light);
  text(18, 292, "1 colonne = 1 échantillon (1 s) → fenêtre ≈ 2 min", 8, C.mid);
  text(18, 308, "valeur en haut à droite de chaque carte = instantané", 8, C.mid);
  text(18, 324, "● clignotant (barre du haut) = connecté · ✕ = déconnecter", 8, C.mid);
  text(18, 340, "serveur coupé ? reconnexion automatique toutes les 3 s", 8, C.mid);
  text(18, 358, "cartes aussi : GPU · TEMP CPU · SYSTÈME · PROCESSUS", 7, C.dim);

  box(10, 382, 460, 152, "DÉPANNAGE");
  text(18, 406, "« hors ligne » → server.py tourne ? bonne adresse ?", 8, C.light);
  text(18, 422, "test rapide : navigateur du téléphone → http://<IP>:8765/", 8, C.mid);
  text(18, 438, "adb reverse ne dure que le temps du câble → le relancer", 8, C.mid);
  text(18, 454, "GPU « N/A » → NVML = cartes NVIDIA uniquement", 8, C.mid);
  text(18, 470, "Wi-Fi → pare-feu : autoriser Python (réseau privé)", 8, C.mid);
  text(18, 486, "température absente → capteurs carte mère (lm-sensors)", 8, C.mid);
  text(18, 508, "Ctrl+C dans le terminal du PC = arrêt du serveur", 7, C.dim);
  footer();
}

function draw() {
  g.fillStyle = C.bg; g.fillRect(0, 0, VW, VH);
  if (page === 0) page1(); else page2();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, cv.width, cv.height);
}
cv.addEventListener("click", () => { page = (page + 1) % 2; draw(); });
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") { page = (page + 1) % 2; draw(); }
  if (e.key === "ArrowLeft") { page = (page + 1) % 2; draw(); }
});
setInterval(draw, 530);
draw();
</script>
</body>
</html>
